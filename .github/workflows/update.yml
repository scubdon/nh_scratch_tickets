name: Refresh data & deploy

# Re-reads the New Hampshire Lottery's prizes-remaining data and republishes the
# static site to GitHub Pages:
#   - daily (the lottery refreshes its counts overnight)
#   - on every push to main, so code changes ship
#   - on demand from the Actions tab

on:
  schedule:
    - cron: "23 11 * * *"   # 11:23 UTC = 7:23 ET (6:23 in winter)
  push:
    branches: [main]
    paths-ignore:
      - "data/**"           # our own daily snapshot commits
  workflow_dispatch:

permissions:
  contents: write           # commit the daily snapshot to data/history
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Fetch latest prize data
        run: python scraper/scrape.py

      # One snapshot per day, committed back to the repo. Skipped on pushes: those
      # are code changes, and committing from them would re-trigger this workflow.
      - name: Record daily snapshot
        if: github.event_name != 'push'
        run: |
          python scraper/record_snapshot.py
          if [[ -z "$(git status --porcelain data/)" ]]; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Record prize snapshot $(TZ=America/New_York date +%Y-%m-%d) [skip ci]"
          git push

      - name: Cache-bust CSS/JS
        run: python scraper/stamp_assets.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
