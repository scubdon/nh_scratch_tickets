name: Discover NH API (temporary)
on:
  push:
    branches: ["claude/**"]
    paths: ["tools/discover.py", ".github/workflows/discover.yml"]
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python tools/discover.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: discover-out, path: out/ }
